services:

  n8n:
    image: n8nio/n8n:latest
    container_name: personal-finance-n8n

    ports:
      - "5678:5678"

    environment:
      - TZ=Asia/Kolkata
      - N8N_SECURE_COOKIE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data

    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./data:/data

    restart: unless-stopped
